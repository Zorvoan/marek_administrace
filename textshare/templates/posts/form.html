{% extends "base.html" %}
{% block title %}{{ 'Edit post' if post else 'New post' }}{% endblock %}
{% block content %}
  <h1>{{ 'Edit post' if post else 'New post' }}</h1>
  <form class="form" method="post">
    {{ csrf_field() }}
    <label for="title">Title</label>
    <input id="title" name="title" value="{{ form['title'] }}" maxlength="{{ title_max }}" required autofocus>

    <label for="category_id">Category</label>
    <select id="category_id" name="category_id" required>
      <option value="" disabled{% if form['category_id'] is none %} selected{% endif %}>Choose a category…</option>
      {% for c in categories %}
        <option value="{{ c.id }}"{% if c.id == form['category_id'] %} selected{% endif %}>{{ c.name }}</option>
      {% endfor %}
    </select>
    <p class="hint">Missing one? <a href="{{ url_for('categories.index') }}">Create a category</a> first.</p>

    <label for="body">Text</label>
    <textarea id="body" name="body" rows="12" maxlength="{{ body_max }}" required>{{ form['body'] }}</textarea>

    <div class="actions">
      <button type="submit" class="btn">{{ 'Save changes' if post else 'Publish' }}</button>
      <a href="{{ url_for('posts.detail', post_id=post.id) if post else url_for('posts.index') }}">Cancel</a>
    </div>
  </form>
{% endblock %}
